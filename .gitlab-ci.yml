workflow:
  rules:
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

stages:
  - test
  - build
  - deploy
  - release

.node:
  image: node:lts-alpine
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules/

"Type-check 🔍":
  extends: .node
  stage: test
  script:
    - npm ci
    - npm run type-check

"Lint 🧹":
  extends: .node
  stage: test
  script:
    - npm ci
    - npm run lint

"Build 🏗️":
  extends: .node
  stage: build
  needs: ["Type-check 🔍", "Lint 🧹"]
  script:
    - npm ci
    - npm run build
  artifacts:
    paths:
      - dist/
    expire_in: 1 week
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - when: on_success

pages:
  extends: .node
  stage: deploy
  needs: ["Build 🏗️"]
  script:
    - cp -r dist/ public/
  artifacts:
    paths:
      - public/
    expire_in: never
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"'
      when: on_success
    - when: never


"Build Review 🏗️":
  extends: .node
  stage: build
  needs: ["Type-check 🔍", "Lint 🧹"]
  script:
    - npm ci
    - npx vite build --base "./"
  artifacts:
    paths:
      - dist/
    expire_in: 1 week
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

"Deploy Review 🔍":
  extends: .node
  stage: deploy
  needs: ["Build Review 🏗️"]
  script:
    - cp -r dist/ public/
  artifacts:
    paths:
      - public/
    expose_as: "Review App"
    expire_in: 1 week
  environment:
    name: review/$CI_COMMIT_REF_SLUG
    url: $CI_JOB_URL/artifacts/raw/public/index.html
    on_stop: "Stop Review 🗑️"
    auto_stop_in: 1 week
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: on_success

"Stop Review 🗑️":
  image: alpine:latest
  stage: deploy
  variables:
    GIT_STRATEGY: none
  script:
    - echo "Review environment for $CI_COMMIT_REF_SLUG stopped."
  environment:
    name: review/$CI_COMMIT_REF_SLUG
    action: stop
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual

"Release 🚀":
  extends: .node
  stage: release
  needs: ["pages"]
  variables:
    GIT_DEPTH: "0"
  before_script:
    - apk add --no-cache git
    - npm ci
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - git config --global user.email "release-bot@${CI_SERVER_HOST}"
    - git config --global user.name "semantic-release"
    - git fetch --tags
    - git remote set-url origin "https://oauth2:${GL_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
  script:
    - npx semantic-release
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"'
      when: on_success
    - when: never
